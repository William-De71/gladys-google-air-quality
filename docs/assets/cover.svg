<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Google Air Quality integration for Gladys Assistant
       (illustration, no Google logo). Built into cover.jpg by
       scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff1fb"/>
      <stop offset="1" stop-color="#f3faf2"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f7fb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#sky)"/>

  <!-- soft clouds of air -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="140" cy="90" rx="90" ry="28"/>
    <ellipse cx="190" cy="72" rx="60" ry="26"/>
    <ellipse cx="640" cy="70" rx="100" ry="30"/>
    <ellipse cx="590" cy="56" rx="56" ry="24"/>
  </g>
  <!-- wind lines -->
  <g fill="none" stroke="#8cc3e6" stroke-width="7" stroke-linecap="round">
    <path d="M60 170 H 230 C 270 170, 270 120, 235 125"/>
    <path d="M560 160 H 730 C 770 160, 770 205, 735 200"/>
    <path d="M90 215 H 190"/>
  </g>

  <!-- city skyline and trees -->
  <g fill="#c9d6e3">
    <rect x="0" y="380" width="70" height="154"/>
    <rect x="80" y="330" width="60" height="204"/>
    <rect x="150" y="360" width="80" height="174"/>
    <rect x="570" y="340" width="70" height="194"/>
    <rect x="650" y="300" width="60" height="234"/>
    <rect x="720" y="370" width="80" height="164"/>
  </g>
  <g fill="#e8eef4">
    <rect x="92" y="350" width="12" height="14"/><rect x="116" y="350" width="12" height="14"/>
    <rect x="92" y="380" width="12" height="14"/><rect x="116" y="380" width="12" height="14"/>
    <rect x="662" y="320" width="12" height="14"/><rect x="686" y="320" width="12" height="14"/>
    <rect x="662" y="350" width="12" height="14"/><rect x="686" y="350" width="12" height="14"/>
  </g>
  <g fill="#6fbf73">
    <circle cx="255" cy="470" r="34"/>
    <circle cx="545" cy="470" r="34"/>
  </g>
  <rect x="0" y="490" width="800" height="44" fill="#a9cf9c"/>

  <!-- the card: a gauge of the universal AQI and pollutants -->
  <g transform="translate(220 150)">
    <rect width="360" height="300" rx="24" fill="url(#card)" stroke="#d6dde6" stroke-width="2"/>
    <g transform="translate(180 150)" fill="none" stroke-linecap="round" stroke-width="22">
      <path d="M-110 0 A 110 110 0 0 1 -77.8 -77.8" stroke="#d64545"/>
      <path d="M-77.8 -77.8 A 110 110 0 0 1 0 -110" stroke="#f29d38"/>
      <path d="M0 -110 A 110 110 0 0 1 77.8 -77.8" stroke="#f2d338"/>
      <path d="M77.8 -77.8 A 110 110 0 0 1 110 0" stroke="#2f9e5a"/>
      <path d="M0 0 L 62 -62" stroke="#1f2d3d" stroke-width="8"/>
    </g>
    <circle cx="180" cy="150" r="12" fill="#1f2d3d"/>
    <text x="180" y="205" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="46" font-weight="700" fill="#1f2d3d">72</text>
    <rect x="30" y="230" width="90" height="44" rx="22" fill="#e3f4e8"/>
    <text x="75" y="259" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#2f7a46">PM2.5</text>
    <rect x="135" y="230" width="90" height="44" rx="22" fill="#e3eef8"/>
    <text x="180" y="259" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#2a5ea8">NO₂</text>
    <rect x="240" y="230" width="90" height="44" rx="22" fill="#fdf1dc"/>
    <text x="285" y="259" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#a86414">O₃</text>
  </g>
</svg>
